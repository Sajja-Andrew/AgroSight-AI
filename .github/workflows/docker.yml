# ═══════════════════════════════════════════════════════════════
# AgroSight AI — Docker Build & Push to GitHub Container Registry
# ═══════════════════════════════════════════════════════════════
# Builds and pushes the api and chat Docker images on every push
# to main/master. Uses GitHub Container Registry (ghcr.io).
#
# Images:
#   ghcr.io/sajja-andrew/agrosight-ai-api:latest
#   ghcr.io/sajja-andrew/agrosight-ai-chat:latest
# ═══════════════════════════════════════════════════════════════

name: Docker Build & Push

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/server/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'Dockerfile.chat'
      - 'docker-compose.yml'
      - 'wsgi.py'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/server/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'Dockerfile.chat'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/sajja-andrew/agrosight-ai-api
  CHAT_IMAGE: ghcr.io/sajja-andrew/agrosight-ai-chat

permissions:
  contents: read
  packages: write

jobs:
  # ── Build & Push API Image ──
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ── Build & Push Chat Image ──
  build-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CHAT_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push Chat image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.chat
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy Check (optional) ──
  deploy-check:
    needs: [build-api, build-chat]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Verify images pushed
        run: |
          echo "✅ Docker images pushed to GitHub Container Registry"
          echo ""
          echo "API Image: ${{ env.API_IMAGE }}:latest"
          echo "Chat Image: ${{ env.CHAT_IMAGE }}:latest"
          echo ""
          echo "Pull commands:"
          echo "  docker pull ${{ env.API_IMAGE }}:latest"
          echo "  docker pull ${{ env.CHAT_IMAGE }}:latest"
