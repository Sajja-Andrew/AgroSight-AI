[pytest]
testpaths = tests pipeline/tests
pythonpath = .
addopts = -v --strict-markers --tb=short --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-report=html --cov-fail-under=70
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    tf: marks tests that mock or use TensorFlow
    db: marks tests that use the database
