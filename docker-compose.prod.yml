# ═══════════════════════════════════════════════════════════════
# AgroSight AI — Production Overrides (Lightweight)
# ═══════════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds:
#   - Read-only root filesystems
#   - tmpfs for /tmp
#   - Tighter CPU / memory ceilings
#   - JSON log rotation
# ═══════════════════════════════════════════════════════════════

services:
  api:
    read_only: true
    user: "agrosight:agrosight"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 200M
      - type: tmpfs
        target: /tmp/agrosight
        tmpfs:
          size: 100M
      - type: tmpfs
        target: /var/tmp
        tmpfs:
          size: 100M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  chat:
    read_only: true
    user: "node:node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 50M
      - type: tmpfs
        target: /app/uploads
        tmpfs:
          size: 50M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 50M
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          size: 50M
      - type: tmpfs
        target: /var/run
        tmpfs:
          size: 10M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    read_only: true
    user: "postgres:postgres"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 100M
      - type: tmpfs
        target: /var/run/postgresql
        tmpfs:
          size: 10M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    read_only: true
    user: "redis:redis"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 50M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
