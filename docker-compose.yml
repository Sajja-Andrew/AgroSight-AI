# ═══════════════════════════════════════════════════════════════
# AgroSight AI — Lightweight Production Docker Compose
# ═══════════════════════════════════════════════════════════════
# Services:
#   api    → Python Flask + TensorFlow CPU inference
#   chat   → Node.js Socket.IO messaging server
#   web    → Nginx (static files + reverse proxy)
#   postgres → PostgreSQL 16
#   minio  → MinIO object storage
#   redis  → Redis cache
#
# Total RAM ceiling: ~3.5 GB (comfortable on 8 GB host)
# ═══════════════════════════════════════════════════════════════

x-common-variables: &common-variables
  APP_ENV: ${APP_ENV:-production}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
  DATABASE_URL: ${DATABASE_URL:-postgresql://agrosight:change-me-in-production@postgres:5432/agrosight}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-agrosight}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-in-production}
  MINIO_BUCKET_UPLOADS: ${MINIO_BUCKET_UPLOADS:-uploads}
  MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS:-models}
  MINIO_BUCKET_DATASETS: ${MINIO_BUCKET_DATASETS:-datasets}
  MINIO_BUCKET_FEEDBACK: ${MINIO_BUCKET_FEEDBACK:-feedback}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

services:
  # ═══════════════════════════════════════════════════════════
  # API — Inference + Flask backend
  # ═══════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: agrosight-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      <<: *common-variables
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_KEEP_ALIVE: ${GUNICORN_KEEP_ALIVE:-2}
      FLASK_APP: /app/backend/app.py
      PYTHONPATH: /app:/app/backend
    volumes:
      - ./saved_models:/app/saved_models:ro
      - ./saved_models_pytorch:/app/saved_models_pytorch:ro
      - uploads-data:/app/backend/uploads
      - db-data:/app/backend/instance
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - agrosight-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: >
      sh -c "PYTHONPATH=/app:/app/backend
      exec gunicorn
      --bind 0.0.0.0:5000
      --workers $${GUNICORN_WORKERS:-2}
      --worker-class gthread
      --threads $${GUNICORN_THREADS:-4}
      --timeout $${GUNICORN_TIMEOUT:-120}
      --keep-alive $${GUNICORN_KEEP_ALIVE:-5}
      --max-requests 1000
      --max-requests-jitter 50
      --access-logfile -
      --error-logfile -
      --log-level info
      wsgi:app"

  # ═══════════════════════════════════════════════════════════
  # CHAT — Node.js Socket.IO server (tiny footprint)
  # ═══════════════════════════════════════════════════════════
  chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
    container_name: agrosight-chat
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
    networks:
      - agrosight-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5001/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  # ═══════════════════════════════════════════════════════════
  # WEB — Nginx static files + reverse proxy
  # ═══════════════════════════════════════════════════════════
  # Comment out this entire service if you don't need a reverse proxy
  # and want to save ~20 MB of RAM.
  # ═══════════════════════════════════════════════════════════
  web:
    image: nginx:alpine
    container_name: agrosight-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx-minimal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - chat
    networks:
      - agrosight-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ═══════════════════════════════════════════════════════════
  # PostgreSQL 16
  # ═══════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: agrosight-postgres
    restart: unless-stopped
    # Internal port not exposed to host for security (access via agrosight-net)
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrosight}
      POSTGRES_USER: ${POSTGRES_USER:-agrosight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/02-init.sh:ro
    networks:
      - agrosight-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ═══════════════════════════════════════════════════════════
  # MinIO — Object Storage
  # ═══════════════════════════════════════════════════════════
  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z
    container_name: agrosight-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      # MinIO console port exposed only if needed; comment out in production
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-agrosight}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-in-production}
      MINIO_BROWSER: "on"
      MINIO_UPDATE: "off"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - agrosight-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ═══════════════════════════════════════════════════════════
  # Redis — Cache / Sessions
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: agrosight-redis
    restart: unless-stopped
    # Internal port not exposed to host for security (access via agrosight-net)
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - agrosight-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

# ═══════════════════════════════════════════════════════════════
# Persistent Volumes
# ═══════════════════════════════════════════════════════════════
volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  uploads-data:
    driver: local
  db-data:
    driver: local
  redis-data:
    driver: local

# ═══════════════════════════════════════════════════════════════
# Internal Docker Network
# ═══════════════════════════════════════════════════════════════
networks:
  agrosight-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
