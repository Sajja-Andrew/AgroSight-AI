# ═══════════════════════════════════════════════════════════════
# AgroSight AI — Loki Log Aggregation Configuration
# ═══════════════════════════════════════════════════════════════
# Collects logs from all containers via Docker logging driver.
# ═══════════════════════════════════════════════════════════════

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# By default, Loki will send errors, this is only relevant when running the Loki alertmanager.
# If you want to disable this, set the following flag to false.
# Disable the /ready endpoint because we use healthcheck instead
# By default, Loki will send errors, this is only relevant when running the Loki alertmanager.
# If you want to disable this, set the following flag to false.
# analytics:
#   reporting_enabled: false

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
