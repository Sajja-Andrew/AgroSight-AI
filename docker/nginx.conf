# ═══════════════════════════════════════════════════════════════
# AgroSight AI — Nginx Production Configuration
# ═══════════════════════════════════════════════════════════════
# Routes:
#   /              → frontend static files (pure HTML/CSS/JS)
#   /api/          → Flask Gunicorn backend
#   /socket.io/    → Node.js Socket.IO server
#   /uploads/      → Uploaded crop images (from backend volume)
#   /minio/        → MinIO console (dev only)
#
# IMPORTANT: This is a multi-page HTML site, NOT a SPA.
# Each .html file is served directly. There is no catch-all
# fallback to index.html.
# ═══════════════════════════════════════════════════════════════

user agrosight;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/agrosight/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging format ──
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Rate limiting zones ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream: Flask API (Gunicorn via Unix socket) ──
    upstream flask_api {
        server unix:/run/agrosight/gunicorn.sock fail_timeout=0;
    }

    # ── Upstream: Node.js Socket.IO (via Unix socket) ──
    upstream node_socketio {
        server unix:/run/agrosight/node.sock fail_timeout=0;
    }

    # ── Upstream: MinIO (optional, for internal routing) ──
    upstream minio_s3 {
        server minio:9000;
    }

    upstream minio_console {
        server minio:9001;
    }

    # ═══════════════════════════════════════════════════════════
    # Main server block
    # ═══════════════════════════════════════════════════════════
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /app/frontend;
        index index.html;

        # ── Security Headers ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=()" always;

        # ── Default root: serve index.html ──
        location = / {
            try_files $uri $uri/ =404;
            expires 1h;
            add_header Cache-Control "public, must-revalidate" always;
        }

        # ── HTML pages: explicit no-cache (they may change on redeploy) ──
        location ~* \.html$ {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ── Static assets: long-term immutable cache ──
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 6M;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # ── Uploaded crop images ──
        location /uploads/ {
            alias /app/backend/uploads/;
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, must-revalidate" always;
            access_log off;
        }

        # ── API Proxy → Flask ──
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://flask_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ── Auth endpoints stricter rate limit ──
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://flask_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── Health Check endpoint (public, no rate limit) ──
        location /api/health {
            proxy_pass http://flask_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            access_log off;
        }

        # ── Socket.IO Proxy → Node.js ──
        location /socket.io/ {
            proxy_pass http://node_socketio/;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Increase buffer for large Socket.IO payloads (base64 images)
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        # ── MinIO S3 API proxy (internal, optional) ──
        location /minio/ {
            proxy_pass http://minio_s3/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 50M;
        }

        # ── Error pages ──
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /app/frontend;
            internal;
        }
    }
}
