# ═══════════════════════════════════════════════════════════════
# AgroSight AI — Redis Production Configuration
# ═══════════════════════════════════════════════════════════════

# ── Memory ──
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence ──
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# ── Security ──
bind 0.0.0.0
protected-mode no
# requirepass change-me-redis-password

# ── Logging ──
loglevel notice

# ── Performance ──
tcp-keepalive 300
timeout 0
