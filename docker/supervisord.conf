; ═══════════════════════════════════════════════════════════════
; AgroSight AI — Supervisor Process Manager Configuration
; ═══════════════════════════════════════════════════════════════
; Runs inside the single Docker container:
;   1. nginx          (public reverse proxy)
;   2. gunicorn       (Flask WSGI server)
;   3. node-chat      (Socket.IO messaging server)
; ═══════════════════════════════════════════════════════════════

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/run/supervisord.pid
nodaemon=true
user=root

[inet_http_server]
port=127.0.0.1:9001
username=admin
password=admin

; ── Nginx ──
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
startsecs=2
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err
priority=10

; ── Gunicorn (Flask API) ──
[program:gunicorn]
command=gunicorn
    --bind unix:/run/agrosight/gunicorn.sock
    --workers %(ENV_GUNICORN_WORKERS)s
    --threads %(ENV_GUNICORN_THREADS)s
    --worker-class gthread
    --worker-tmp-dir /dev/shm
    --timeout %(ENV_GUNICORN_TIMEOUT)s
    --keep-alive %(ENV_GUNICORN_KEEP_ALIVE)s
    --access-logfile -
    --error-logfile -
    --capture-output
    --enable-stdio-inheritance
    --preload
    backend.app:app
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/gunicorn.log
stderr_logfile=/var/log/supervisor/gunicorn.err
environment=PYTHONPATH="/app",FLASK_APP="backend/app.py"
user=agrosight
priority=20

; ── Node.js Socket.IO Chat Server ──
[program:node-chat]
command=node server.js
directory=/app/frontend/server
autostart=true
autorestart=true
startretries=5
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/node-chat.log
stderr_logfile=/var/log/supervisor/node-chat.err
environment=NODE_ENV="production",SOCKET_PATH="/run/agrosight/node.sock",PORT="5001"
user=agrosight
priority=30

; ── Flask DB Migration (one-shot at startup) ──
[program:db-migrate]
command=bash -c "sleep 5 && if [ -d /app/backend/migrations ]; then flask db upgrade; else echo 'Migrations directory not found. Run: flask db init && flask db migrate -m \"Initial migration\"'; fi"
directory=/app
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/supervisor/db-migrate.log
stderr_logfile=/var/log/supervisor/db-migrate.err
user=agrosight
priority=15

; ── Event listener: restart gunicorn on crash ──
; NOTE: crashmail requires sendmail which is not installed in this image.
; Uncomment below only if you add sendmail to the Dockerfile.
; [eventlistener:crashmail]
; command=crashmail
;     -a -m devops@agrosight.ai
;     -s "/usr/sbin/sendmail -t -i"
; events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
; buffer_size=1024
