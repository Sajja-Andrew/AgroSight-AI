<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AgroSight AI</title>
    <meta name="color-scheme" content="dark">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
    <div class="modal-content" style="max-width: 420px;">
        <div class="modal-header">
            <h3 style="text-align: center;">
                <i class="fas fa-shield-alt" style="font-size: 50px; display: block; margin-bottom: 15px; color: var(--primary);"></i>
                Admin Login
            </h3>
        </div>
        
        <p style="text-align:center;margin-bottom:16px;font-size:0.9rem;">
            <a href="index.html" style="color:var(--text-muted);text-decoration:none;"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </p>
        <form id="adminLoginForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="adminUsername" required placeholder="Enter admin username">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="adminPassword" required placeholder="Enter admin password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const identifier = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            const API_BASE_URL = window.API_CONFIG ? window.API_CONFIG.BASE_URL : 'http://127.0.0.1:5000/api';

            try {
                const res = await fetch(API_BASE_URL + '/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('sc_token', data.token);
                    localStorage.setItem('AgroSightAI_current_user', JSON.stringify(data.user));
                    window.location.href = 'admin-dashboard.html';
                } else {
                    alert(data.message || 'Invalid credentials! Please try again.');
                }
            } catch (err) {
                console.error('Admin login error:', err);
                if (err.name === 'TypeError' || err.message.includes('fetch') || err.message.includes('NetworkError')) {
                    alert('Cannot connect to server. Make sure the backend is running on http://127.0.0.1:5000');
                } else {
                    alert('Server error. Please try again.');
                }
            }
        });
    </script>
</body>
</html>
