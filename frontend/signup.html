<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AgroSight AI</title>
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1><i class="fas fa-leaf"></i> AgroSight AI</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="signin.html">Sign In</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h2>Create Account</h2>
                        <p>Join AgroSight AI to protect your crops</p>
                    </div>
                    
                    <form id="signupForm" class="auth-form">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required>
                            <i class="fas fa-user"></i>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required>
                            <i class="fas fa-envelope"></i>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required>
                            <i class="fas fa-phone"></i>
                        </div>

                        <div class="form-group">
                            <label for="role">I am a:</label>
                            <select id="role" name="role" required>
                                <option value="">Select role</option>
                                <option value="farmer">Farmer</option>
                                <option value="agrovet">Agro-Vet</option>
                            </select>
                            <i class="fas fa-user-tag"></i>
                        </div>

                        <div class="form-group">
                            <label for="location">Farm/Business Location</label>
                            <input type="text" id="location" name="location" placeholder="City, District, Country" required>
                            <i class="fas fa-map-marker-alt"></i>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                            <i class="fas fa-lock"></i>
                            <span class="password-hint">Minimum 8 characters</span>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                            <i class="fas fa-lock"></i>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>

                        <div class="auth-footer">
                            <p>Already have an account? <a href="signin.html">Sign In</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
